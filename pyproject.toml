[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grimoire"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "nltk>=3.8",
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["grimoire*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
