[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grimoire-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "nltk>=3.8",
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ui = [
    "gradio>=4.0",
]
scraper = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.10",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "py7zr>=0.20",
]
scraper-ocr = [
    "grimoire-ai[scraper]",
    "pytesseract>=0.3",
    "Pillow>=10.0",
]
encoder = [
    "sentence-transformers>=2.2",
]
quantize = [
    "torchao>=0.9",
]
stats = [
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["grimoire_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
