name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PyTorch (CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and dev dependencies
        run: |
          pip install -e ".[dev,scraper]"

      - name: Run unit tests
        run: |
          pytest tests/ --ignore=tests/test_integration.py \
            -v --tb=short \
            --junitxml=reports/unit-results.xml

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.python-version }}
          path: reports/unit-results.xml

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    # Run after unit tests pass — no point running the full pipeline
    # if individual modules are already broken.
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyTorch (CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and dev dependencies
        run: |
          pip install -e ".[dev,scraper]"

      - name: Run integration tests
        run: |
          pytest tests/test_integration.py \
            -v --tb=short \
            --junitxml=reports/integration-results.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: reports/integration-results.xml
